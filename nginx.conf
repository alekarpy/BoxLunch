server {
    listen 8080;
    server_name _;

    location / {
        root /usr/share/nginx/html/boxlunch;
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy so frontend (boxlunch.alekarpy.uk) and API share the exact same origin
    # This completely resolves third-party cookie blocking on iOS Safari & Chrome Mobile
    location /api/ {
        proxy_pass https://boxlunchapi-production.up.railway.app/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host boxlunchapi-production.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}